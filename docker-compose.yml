version: '3.8'

services:
  mdz-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdz-os-app
    ports:
      - "3020:3020"
    volumes:
      # Mount a dedicated directory for production SQLite database isolation
      # Make sure the host ./production-data directory exists
      - ./production-data:/app/prisma/data
    environment:
      - NODE_ENV=production
      - PORT=3020
      - NEXTAUTH_URL=http://localhost/mdz-os
      - NEXTAUTH_SECRET=super_secret_mdz_os_key_2026_!@#
      - DATABASE_URL=file:/app/prisma/data/production.db
    restart: unless-stopped

