version: '3.8'

services:
  ess-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ess-os-app
    ports:
      - "3040:3040"
    volumes:
      # Mount a dedicated directory for production SQLite database isolation
      # Make sure the host ./production-data directory exists
      - ./production-data:/app/prisma/data
    environment:
      - NODE_ENV=production
      - PORT=3040
      - NEXTAUTH_URL=http://200.97.161.91/ess-crm
      - NEXTAUTH_SECRET=super_secret_ess_os_key_2026_!@#
      - DATABASE_URL=file:/app/prisma/data/production.db
    restart: unless-stopped

