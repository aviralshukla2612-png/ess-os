version: '3.8'

services:
  ess-os-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ess-os-app-test
    volumes:
      - ./prisma-test:/app/prisma
    environment:
      - NODE_ENV=production
      - PORT=3040
      - NEXTAUTH_URL=http://localhost:8080/ess-os
      - NEXTAUTH_SECRET=super_secret_ess_os_test_key_!@#
      - DATABASE_URL=file:./test-prod.db
    restart: unless-stopped
    networks:
      - ess-test-network

  nginx-test:
    image: nginx:alpine
    container_name: ess-nginx-test
    ports:
      - "8080:80"
    volumes:
      - ./nginx-test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ess-os-test
    networks:
      - ess-test-network

networks:
  ess-test-network:
    driver: bridge
